<g class="av-legend"><rect x="2" y="695" width="829" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="12" y="713">Key</text><text class="av-keyh" x="12" y="729">Colour: which part of the architecture a box belongs to</text><rect x="12" y="738" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="70" y="749">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="12" y="758" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="70" y="769">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="12" y="789">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="12" y="797" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="70" y="813">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="12" y="827" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="70" y="843">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="12" y="869">Other marks</text><rect x="12" y="876" width="44" height="18" fill="#fff" stroke="#555"/><rect x="22" y="881" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="70" y="889">A box inside another box: a part of it</text><rect x="12" y="898" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="12" y="898" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="70" y="909">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="12" y="929">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M22 945 L54 945" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="70" y="949">Assignment: is assigned to, or carries out</text><path d="M22 965 L54 965" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="70" y="969">Access: reads or writes data (the arrow shows which way the data goes)</text><path d="M22 985 L54 985" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="70" y="989">Flow: passes something, such as information, to</text></g></svg>
