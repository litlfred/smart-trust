<!-- The GDHCN trust network, two ways, with a toggle; the page that includes it keeps its own <figure> and caption, so the
     caption stays a translated string of that page. Both are drawn from the ArchiMate view "The GDHCN trust network"
     (archimate/1.7.5/smart-trust.archimate, id-5298d99ad0315566893ee45bb581560e, built by archimate/build.py in the layout of
     input/images/trust_network.png):
     - "As drawn": archimate/pretty.py, in the original figure's style; each pictogram is an element of the model and opens
       its ActorDefinition or concept page;
     - "ArchiMate": the archimate-pages visualiser's drawing, shown as an image (the IG content QA gate refuses embedded objects); the
       picture links to the SVG itself, where each box opens its ArchiMate element. -->
<style>
.tn-fig .tn-pane{display:none}
.tn-fig input{position:absolute;opacity:0}
.tn-fig label{display:inline-block;padding:4px 12px;margin:0 4px 8px 0;border:1px solid #4472C4;border-radius:14px;color:#2F5597;cursor:pointer;font-size:.9em}
#tn-as-drawn:checked ~ .tn-pane-drawn, #tn-archimate:checked ~ .tn-pane-archimate{display:block}
#tn-as-drawn:checked ~ label[for=tn-as-drawn], #tn-archimate:checked ~ label[for=tn-archimate]{background:#4472C4;color:#fff}
</style>
<div class="tn-fig">
<input type="radio" name="tn-view" id="tn-as-drawn" checked="checked"/>
<input type="radio" name="tn-view" id="tn-archimate"/>
<label for="tn-as-drawn">As drawn</label>
<label for="tn-archimate">ArchiMate</label>
<div class="tn-pane tn-pane-drawn">{% include trust-network-pretty.svg %}</div>
<div class="tn-pane tn-pane-archimate">
<a href="archimate/1.7.5/views/id-5298d99ad0315566893ee45bb581560e.svg" title="Open the ArchiMate view on its own, where each box links to its ArchiMate element">
<img src="archimate/1.7.5/views/id-5298d99ad0315566893ee45bb581560e.svg" alt="The GDHCN trust network, ArchiMate view" style="width:100%;height:auto"/>
</a>
<p style="font-size:.85em">The view in this guide's <a href="en/smart-trust/archimate/1.7.5/views/the-gdhcn-trust-network/">ArchiMate model</a>.</p>
</div>
</div>
