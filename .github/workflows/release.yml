name: Release build

# Least privilege: nothing by default; each job asks for what it uses.
permissions: {}

# Manual trigger only (owner decision, 2026-10-06): GitHub workflows here are
# defined, not run automatically. Start it from the Actions tab.
# (workflow_call, if present, is kept so other repositories can call it.)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      file_exists: ${{ steps.checkfile.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check for publication-request.json
        id: checkfile
        run: |
          if [[ -f "publication-request.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  trigger:
    needs: check
    if: needs.check.outputs.file_exists == 'true'
    # The called workflow publishes, so this job keeps the write scopes it
    # had. It is another organisation's branch, not a pinned commit: whether
    # to pin it is the owner's decision (security review 2026-10-31).
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    uses: WorldHealthOrganization/smart-html/.github/workflows/release.yml@main
#    with:
#      tag_name: ${{ github.event.release.tag_name }}
