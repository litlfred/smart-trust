# This workflow reuses the openHIE GitHub action for building IGs
# Change log:
# v0.1.0
# 2021-06-18: publish default branches to / , other branches branches/<branch>
# 2021-11-26: reusable workflow

name: HL7 FHIR AutoBuild Trigger

permissions:
  contents: write

# Manual trigger only (owner decision, 2026-10-06): no build runs on push or
# pull request. Run it from the Actions tab when a build is wanted.
on:
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  # litlfred/smart-base, not WorldHealthOrganization/smart-base (owner card
  # 2026-10-30T16:56Z, "A. Do both now"; bean folio-assistant-cz17;
  # smart-immunizations#89 is the model): this repository's DAK declaration is
  # index.config.json contentTypes.dak, and dak.json is gone. The called
  # workflow takes no inputs and no secrets.
  call_build:
    # Pinned to smart-base main. The comment sits on its own line because the
    # tools pin in index.lock.json predates cat-harness-tools#1314, whose
    # site-publisher could not read a uses: line with a trailing comment
    # (smart-trust#124).
    uses: litlfred/smart-base/.github/workflows/fhirbuild.yml@49178a48d460bb53acf6e90d8c0aee3f0146d8f7
