name: HL7 FHIR AutoBuild Trigger

permissions:
  contents: write

# Manual trigger only (owner decision, 2026-10-06): no build runs on push or
# pull request. Run it from the Actions tab when a build is wanted.
on:
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  call_build: 
    uses: WorldHealthOrganization/smart-base/.github/workflows/fhirbuild.yml@main
