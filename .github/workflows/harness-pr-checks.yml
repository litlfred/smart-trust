# smart-trust's harness checks on every pull request.
#
# Owner, 2026-10-14: "There should be CI running", and ("1") through ONE
# reusable workflow the harness owns, not a copy per repository; and "A
# harnessed repo should run not just core but all of the checks in the
# dependency harness".
#
# The 2026-10-06 ruling that this fork's workflows are "defined, not run on
# events" was about the WHO IG builds inherited from upstream (fhirbuild,
# release, site-publish, ...), which stay manual and are not touched here; it
# switched the harness gates off with them, and nothing turned them back on.
#
# The checks themselves live in cat-harness-tools
# (`.github/workflows/layer-pr-checks.yml`): smart-trust swapped into the
# folio-assistant index; typecheck; its tests; and the gates of smart-trust and
# its whole dependency harness, failing only on what this PR newly breaks.
name: Harness PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: smart-trust
      path-in-repo: .
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
