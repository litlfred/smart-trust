name: Generate Participants

permissions:
  contents: write

# Manual trigger only (owner decision, 2026-10-06): GitHub workflows here are
# defined, not run automatically. Start it from the Actions tab.
# (workflow_call, if present, is kept so other repositories can call it.)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to generate (PROD, UAT, DEV)'
        required: true
        default: 'PROD'
        type: choice
        options:
        - PROD
        - UAT
        - DEV


jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Setup Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install --require-hashes -r .github/requirements/generate-participants.lock
        
    - name: Determine environment
      id: env
      env:
        INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        case "$INPUT_ENVIRONMENT" in
          PROD|UAT|DEV) ;;
          *) echo "::error::refused: environment must be PROD, UAT or DEV"; exit 1 ;;
        esac
        echo "environment=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
        echo "Using environment: $INPUT_ENVIRONMENT"
        
    - name: Generate organization files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ENVIRONMENT: ${{ steps.env.outputs.environment }}
      run: |
        python3 input/scripts/generate_organizations.py --env "$ENVIRONMENT" --source github-api
        
    - name: Check for changes
      id: changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      env:
        ENVIRONMENT: ${{ steps.env.outputs.environment }}
      run: |
        git add input/fsh/instances/ input/fsh/codesystems/ input/fsh/valuesets/
        git commit -m "Auto-update $ENVIRONMENT participants from repository changes"
        git push